discord:
  token: "your-user-token-here"

logging:
  level: INFO # use DEBUG for chat/tool round details

llm:
  # Provider base URLs:
  #   Anthropic:  https://api.anthropic.com/v1/
  #   OpenAI:     https://api.openai.com/v1
  #   xAI/Grok:   https://api.x.ai/v1
  #   OpenRouter:  https://openrouter.ai/api/v1
  #   Ollama:     http://localhost:11434/v1
  base_url: "https://api.anthropic.com/v1/"
  api_key: "your-api-key-here"
  model: "claude-sonnet-4-6"
  max_tokens: 1024
  temperature: 1.0
  vision: false # pass image attachments to the model (requires a vision-capable model)
  web_search:
    enabled: true # expose a web_search function tool to tool-capable chat models
    max_results: 5 # cap results returned to the model per search
    max_tool_rounds: 5 # max tool-call iterations before giving up
    fetch_max_chars: 12000 # default readable chars returned by web_fetch
    fetch_hard_max_chars: 100000 # max readable chars web_fetch may request for long logs/docs
    brave_api_key: "" # Brave Search API Key (X-Subscription-Token)
    log_payloads: false # DEBUG-log full tool JSON payloads, truncated to 10000 chars
  system_prompt: |
    You are a casual Discord user. Keep responses concise and conversational.
    Match the tone of the channel. Avoid long-winded replies.

reply_modes:
  mention:
    enabled: true
    channel_ids: [] # empty = all channels
    user_ids: [] # empty = respond to all users

  random:
    enabled: false
    one_in: 50 # reply to 1 in every 50 messages (probabilistic)
    channel_ids: [] # empty = all channels

  interesting:
    enabled: false
    interval_minutes: 15
    channel_ids: [] # empty = monitor all channels
    lookback_messages: 50

context:
  channels:
    max_messages: 15
    max_message_length: 500
    max_conversation_turns: 10 # how many exchanges to remember per user per channel
  dms:
    max_messages: 25
    max_message_length: 1000

behavior:
  typing_indicator: true
  simulated_typing_delay: false # delay replies based on response length to seem human
  ignore_bots: true
  reply_to_dms: false # respond to 1-on-1 direct messages (always replies)
  reply_to_group_dms: false # respond in group DMs (only when mentioned)
  command_prefix: ">"
